name: Daily job alerts

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 8:00 am Singapore time
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to save state/seen_jobs.json back to the repo

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: python main.py

      - name: Save seen-jobs state
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add state/seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
